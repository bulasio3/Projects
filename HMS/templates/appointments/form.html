{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ page_title }} — MediCare{% endblock %}

{% block content %}
<div class="panel" style="max-width:700px;">
  <div class="panel-head">
    <h2><i data-lucide="calendar-plus" class="head-icon"></i> {{ page_title }}</h2>
    <a href="{% url 'appointment_list' %}" class="btn-ghost"><i data-lucide="arrow-left"></i> Back</a>
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div style="margin-top:20px;">
      <button class="btn-sm btn-success" type="submit"><i data-lucide="save"></i> Book</button>
    </div>
  </form>
</div>
{% endblock %}
